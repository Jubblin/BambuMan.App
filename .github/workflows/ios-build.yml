name: iOS Build

on:
  push:
    branches: [ main, ios-create ]
    paths-ignore:
      - '**/*.md'
      - '**/*.gitignore'
      - '**/*.gitattributes'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true                     # Disable the .NET logo
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true # Disable the .NET first time experience
  DOTNET_CLI_TELEMETRY_OPTOUT: true       # Disable sending .NET CLI telemetry

jobs:

# MAUI iOS simulator build (unsigned, no secrets)
  build-ios:
    runs-on: macos-latest
    name: iOS Build
    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI Workload
        run: dotnet workload install maui --ignore-failed-sources

      - name: Show toolchain
        run: |
          xcodebuild -version
          dotnet --info
          dotnet workload list

      - name: Build MAUI iOS (simulator)
        run: dotnet build src/BambuMan/BambuMan.csproj -c Debug -f net10.0-ios -p:RuntimeIdentifier=iossimulator-arm64
