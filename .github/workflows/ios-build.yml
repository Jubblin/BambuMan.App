name: iOS Build

on:
  push:
    branches: [ main, ios-create ]
    paths-ignore:
      - '**/*.md'
      - '**/*.gitignore'
      - '**/*.gitattributes'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true                     # Disable the .NET logo
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true # Disable the .NET first time experience
  DOTNET_CLI_TELEMETRY_OPTOUT: true       # Disable sending .NET CLI telemetry

jobs:

# MAUI iOS simulator build (unsigned, no secrets)
  build-ios:
    # The current .NET for iOS SDK needs Xcode 27.x, which is only on the xcode-27 image (public preview)
    runs-on: xcode-27
    name: iOS Build
    env:
      # Must match the Xcode version the installed .NET for iOS SDK requires (27.1.x needs Xcode 27.1)
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI Workload
        run: dotnet workload install maui --ignore-failed-sources

      - name: Show toolchain
        run: |
          xcodebuild -version
          dotnet --info
          dotnet workload list

      # The NFC entitlements make the simulator build sign the app; CodesignKey=- signs it ad-hoc, so no certificate or secrets are needed
      - name: Build MAUI iOS (simulator)
        run: dotnet build src/BambuMan/BambuMan.csproj -c Debug -f net10.0-ios -p:RuntimeIdentifier=iossimulator-arm64 -p:CodesignKey=-
